name: InMan Windows build and regression tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q controllers models gui utils tests main.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build Windows executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all customtkinter --icon assets/CustomTkinter_icon_Windows.ico --name InMan main.py

      - name: Upload test build artifact
        uses: actions/upload-artifact@v4
        with:
          name: InMan-Windows-test-build
          path: dist/InMan.exe

      - name: Publish v1.4 release after release merge
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'release: v1.4')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create v1.4 dist/InMan.exe --target "${{ github.sha }}" --title "InMan v1.4 - Internal refactor" --notes "Refactored internals with the original screen layouts, inventory workflows and classic IM icon. Uses the same SQLite schema. Release binaries are not Authenticode signed."
