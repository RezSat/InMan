name: Rust desktop build and compatibility tests

on:
  push:
    branches:
      - main
      - rust-refactor
      - rust-v2-completion
    paths:
      - 'rust/**'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'rust/**'
      - '.github/workflows/rust-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  windows-rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Static formatting
        run: cargo fmt --all
      - name: Rust regression tests
        run: cargo test --all-targets --verbose
      - name: Audit common Rust mistakes
        run: cargo clippy --all-targets -- -D warnings
      - name: Build optimized Windows EXEs
        run: cargo build --release --bins
      - name: Windows GUI startup smoke test
        shell: pwsh
        run: ./scripts/windows-startup-smoke.ps1 -Executable target/release/inman.exe
      - name: Upload startup diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: InMan-startup-diagnostics
          path: rust/target/startup-smoke/**
          if-no-files-found: ignore
      - name: Upload Rust test executable
        uses: actions/upload-artifact@v4
        with:
          name: InMan-Rust-Development
          path: |
            rust/target/release/inman.exe
            rust/target/release/inman-inspect.exe

  linux-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Install desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libx11-dev libxkbcommon-dev libasound2-dev libudev-dev libssl-dev pkg-config
      - name: Core tests
        run: cargo test --lib

  publish-rc:
    needs: [windows-rust, linux-core]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/rust-v2-completion' && contains(github.event.head_commit.message, 'release: v2.0.0-rc.1')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: InMan-Rust-Development
          path: build
      - name: Prepare release files and SHA256 checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging | Out-Null
          Copy-Item build/inman.exe staging/InMan.exe
          Copy-Item build/inman-inspect.exe staging/InMan-Inspect.exe
          $files = @("InMan.exe", "InMan-Inspect.exe")
          $lines = foreach ($name in $files) {
            $hash = (Get-FileHash "staging/$name" -Algorithm SHA256).Hash.ToLower()
            "$hash  $name"
          }
          $lines | Set-Content -Path staging/SHA256SUMS.txt -Encoding ascii
      - name: Publish InMan v2 release candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.0-rc.1 staging/InMan.exe staging/InMan-Inspect.exe staging/SHA256SUMS.txt --target "${{ github.sha }}" --prerelease --title "InMan 2.0 RC1 - Native Rust" --notes "Native Rust development release with preserved SQLite schema, Windows product-key licensing, manager workflows, multi-item assignment, bulk transfers, verified SQLite snapshots and Excel compatibility checks. Automated tests and optimized Windows build must pass before publishing. Manual Windows UI parity and real-machine performance validation are still required before the stable v2.0 tag. TEST ON A COPY of inventory.db. Unsigned EXE; Windows SmartScreen may warn."
